name: Mastodon GitHub Bot

on:
  schedule:
    # Run every 5 minutes (minimum allowed by GitHub Actions)
    # Note: Original bot used 2 minutes, but GitHub Actions minimum is 5 minutes
    - cron: '*/5 * * * *'
  workflow_dispatch: # Allow manual trigger

jobs:
  post-to-mastodon:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          pip install Mastodon.py requests
      
      - name: Fetch and post new issues to Mastodon
        env:
          MASTODON_INSTANCE: ${{ secrets.MASTODON_INSTANCE }}
          MASTODON_ACCESS_TOKEN: ${{ secrets.MASTODON_ACCESS_TOKEN }}
          GITHUB_REPO_OWNER: ${{ secrets.GITHUB_REPO_OWNER }}
          GITHUB_REPO_NAME: ${{ secrets.GITHUB_REPO_NAME }}
          VISIBILITY: ${{ secrets.MASTODON_VISIBILITY || 'unlisted' }}
          LAST_ISSUE_NUMBER: ${{ vars.MASTODON_LAST_ISSUE_NUMBER || '0' }}
        run: |
          python scripts/mastodon_bot.py
      
      - name: Update last issue number
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Read the updated last issue number from the script output
          if [ -f /tmp/last_issue_number.txt ]; then
            LAST_ISSUE=$(cat /tmp/last_issue_number.txt)
            gh variable set MASTODON_LAST_ISSUE_NUMBER --body "$LAST_ISSUE"
            echo "Updated MASTODON_LAST_ISSUE_NUMBER to $LAST_ISSUE"
          fi
