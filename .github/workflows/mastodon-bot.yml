name: Mastodon GitHub Bot

on:
  schedule:
    # Run every 5 minutes (minimum allowed by GitHub Actions)
    # Note: Original bot used 2 minutes, but GitHub Actions minimum is 5 minutes
    - cron: '*/5 * * * *'
  workflow_dispatch: # Allow manual trigger

jobs:
  post-to-mastodon:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          pip install Mastodon.py requests
      
      - name: Fetch and post new issues to Mastodon
        env:
          MASTODON_INSTANCE: ${{ secrets.MASTODON_INSTANCE }}
          MASTODON_ACCESS_TOKEN: ${{ secrets.MASTODON_ACCESS_TOKEN }}
          GITHUB_REPO_OWNER: ${{ secrets.GITHUB_REPO_OWNER }}
          GITHUB_REPO_NAME: ${{ secrets.GITHUB_REPO_NAME }}
          VISIBILITY: ${{ secrets.MASTODON_VISIBILITY || 'unlisted' }}
          INTERVAL_MINUTES: '10'  # Check last 10 minutes (covers 2 workflow runs)
        run: |
          python scripts/mastodon_bot.py
