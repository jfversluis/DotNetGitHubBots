name: Bluesky GitHub Bot

on:
  schedule:
    # Run every 5 minutes (minimum allowed by GitHub Actions)
    # Note: Original bot used 2 minutes, but GitHub Actions minimum is 5 minutes
    - cron: '*/5 * * * *'
  workflow_dispatch: # Allow manual trigger

jobs:
  post-to-bluesky:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write  # Required to create/update tracking issues
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          pip install atproto requests
      
      - name: Fetch and post new issues to Bluesky
        env:
          BLUESKY_HANDLE: ${{ secrets.BLUESKY_HANDLE }}
          BLUESKY_APP_PASSWORD: ${{ secrets.BLUESKY_APP_PASSWORD }}
          GITHUB_REPO_OWNER: ${{ secrets.GITHUB_REPO_OWNER }}
          GITHUB_REPO_NAME: ${{ secrets.GITHUB_REPO_NAME }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BOT_REPO_OWNER: ${{ github.repository_owner }}
          BOT_REPO_NAME: ${{ github.event.repository.name }}
        run: |
          python scripts/bluesky_bot.py
